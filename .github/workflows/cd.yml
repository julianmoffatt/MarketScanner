name: CD

# Entrega continua: cada vez que algo entra en main, se construyen las dos imagenes de Docker
# y se publican en GitHub Container Registry (ghcr.io).
#
# No hace falta repetir los tests aqui: main esta protegido y solo se puede llegar a el con un
# pull request cuya CI (backend, frontend y docker) ha pasado, asi que lo que se publica ya esta
# comprobado.
on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestana Actions (util para volver a publicar sin un commit nuevo).
  workflow_dispatch:

# Permisos minimos del token que GitHub da a este workflow: leer el codigo y escribir paquetes.
# Todo lo demas queda denegado.
permissions:
  contents: read
  packages: write

# Si llegan dos pushes seguidos a main, el segundo espera al primero en vez de pisarlo.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # "matrix" repite este mismo job una vez por cada elemento: aparecen como
    # "publish (backend)" y "publish (frontend)", cada uno en su maquina y a la vez.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Inicia sesion en ghcr.io con el token automatico de GitHub: no hay que crear ni guardar
      # ninguna contrasena (GITHUB_TOKEN existe solo mientras dura el workflow).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcula el nombre y las etiquetas de la imagen:
      #   ghcr.io/<usuario>/marketscanner-backend:latest
      #   ghcr.io/<usuario>/marketscanner-backend:sha-<commit>   (version exacta, no cambia nunca)
      # Tambien pone el nombre en minusculas, que es lo que exige el registro.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/marketscanner-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de capas entre ejecuciones: si requirements.txt no cambia, no se reinstala todo.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
