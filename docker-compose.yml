services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - ms_data:/app/backend/data
      - ms_models:/app/backend/models

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  ms_data:
  ms_models: