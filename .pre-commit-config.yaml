repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (sin integracion)
        entry: python -m pytest -m "not integration and not slow" -q
        language: system
        pass_filenames: false
        always_run: true
