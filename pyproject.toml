[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests que combinan varios modulos (API, pipeline); mas lentos que los unitarios",
    "slow: tests lentos (p.ej. entrenamiento de modelos)",
]
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.coverage.run]
source = ["backend/src/market_platform"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
# Conjunto minimo: errores reales (sintaxis, nombres indefinidos, comparaciones
# erroneas). El codigo existente aun incumple F401/F403/F405/F841 e imports
# desordenados; ampliar a ["F", "I", "B"] cuando se limpie.
select = ["E4", "E7", "E9", "F63", "F7", "F82"]
